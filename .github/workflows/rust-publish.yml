name: Publish Rust client to crates.io

# Manual release from master; see "Releasing" in README.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run all checks but do not publish, create/push the tag, or create the release.'
        type: boolean
        default: false

# Two publish runs must never race.
concurrency:
  group: rust-publish
  cancel-in-progress: false

# `contents: write` for the tag and release, `id-token: write` for crates.io Trusted Publishing.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for the tag lookups.
          fetch-depth: 0

      # A released version is immutable, so only master may be released.
      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Publishing is only allowed from master, but this run is on '${GITHUB_REF}'."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      # Same quality gate as CI.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      # The tag comes from the `version` in Cargo.toml, which `CLIENT_VERSION` reads as well.
      - name: Resolve version from Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ -z "${version}" ]; then
            echo "::error::Could not read the crate version from Cargo.toml."
            exit 1
          fi
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Crate version '${version}' is not a bare semver (X.Y.Z)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v${version}"

      # Fail before publishing when this version was already released.
      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin; bump the version in Cargo.toml first."
            exit 1
          fi

      # Surfaces packaging problems before any tag or registry interaction.
      - name: Verify package (dry run)
        run: cargo publish --dry-run --verbose

      # The tag and release come before `cargo publish`, see "Releasing" in README.md.

      # Tag the released commit.
      - name: Create and push release tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      # The release notes are the CHANGELOG section of this version.
      - name: Build release notes from CHANGELOG
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `index` matches the heading literally, not as a regex.
          notes=$(awk -v ver="## [${VERSION}]" '
            index($0, ver)==1 {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "${notes}" | tr -d '[:space:]')" ]; then
            notes="Apify Rust client v${VERSION}. See CHANGELOG.md for details."
          fi
          {
            echo "RELEASE_NOTES<<__EOF__"
            echo "${notes}"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      # Creates the release, or updates it when a re-run finds one.
      - name: Create GitHub release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes "${RELEASE_NOTES}"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes "${RELEASE_NOTES}"
          fi

      # Trusted Publishing: a short-lived crates.io token from the OIDC identity.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --verbose
