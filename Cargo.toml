[package]
name = "apify-client"
version = "0.13.1"
authors = ["Apify Technologies <support@apify.com>"]
description = "An official, but experimental, AI-generated and AI-maintained Rust client for the Apify API (https://apify.com)."
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/apify/apify-client-rust"
homepage = "https://apify.com"
documentation = "https://docs.rs/apify-client"
readme = "README.md"
keywords = ["apify", "api", "client", "scraping", "automation"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
brotli = "7"
flate2 = "1"
# Minimum-version floors for the TLS trust stack behind the `rustls` feature. The crates are not
# used directly: `reqwest` pulls them in, and pinning a floor here makes Cargo refuse a lockfile
# that still holds a release trusting the compromised intermediate CA certificates.
rustls-webpki = { version = "0.103.16", optional = true }
webpki-roots = { version = "1.0.10", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls", "dep:rustls-webpki", "dep:webpki-roots"]
